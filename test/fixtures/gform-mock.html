<!doctype html>
<html><head><title>Mock Google Form - Internship Application</title>
<style>
.hidden{display:none}
div[role="listitem"]{margin:12px 0}
div[role="button"]{display:inline-block;padding:6px 12px;border:1px solid #888;cursor:pointer}
div[role="radio"],div[role="checkbox"]{width:18px;height:18px;border:2px solid #333;display:inline-block;cursor:pointer;margin-right:6px}
div[role="listbox"]{border:1px solid #888;padding:8px;min-width:160px;cursor:pointer;display:inline-block}
div[role="option"]{padding:6px 10px;cursor:pointer;border:1px solid #ccc;margin:2px}
input,textarea{display:block;margin-top:4px;padding:4px}
</style>
</head>
<body>
<h1>Internship Application (mock of a Google Form)</h1>
<div id="page1">
  <div role="listitem">
    <div role="heading">Full name *</div>
    <input type="text" aria-label="Full name">
  </div>
  <div role="listitem">
    <div role="heading">Email *</div>
    <input type="email" aria-label="Email">
  </div>
  <div role="listitem">
    <div role="heading">Which role are you applying for? *</div>
    <div role="radio" aria-label="Software Engineer" tabindex="0"></div>
    <div role="radio" aria-label="Data Analyst" tabindex="0"></div>
    <div role="radio" aria-label="Product Manager" tabindex="0"></div>
  </div>
  <div role="button" id="next1" tabindex="0" onclick="goPage2()">Next</div>
</div>
<div id="page2" class="hidden">
  <div role="listitem">
    <div role="heading">Which skills do you have?</div>
    <div role="checkbox" aria-label="Python" tabindex="0"></div>
    <div role="checkbox" aria-label="Java" tabindex="0"></div>
    <div role="checkbox" aria-label="Excel" tabindex="0"></div>
  </div>
  <div role="listitem">
    <div role="heading">Highest education *</div>
    <div role="listbox" id="edu" tabindex="0" onclick="toggleOpts()"><span>Choose</span>
      <div role="option" class="opt hidden">B.Tech</div>
      <div role="option" class="opt hidden">M.Tech</div>
      <div role="option" class="opt hidden">MBA</div>
    </div>
  </div>
  <div role="listitem">
    <div role="heading">Upload your resume *</div>
    <input type="file" aria-label="Upload your resume">
  </div>
  <div role="listitem">
    <div role="heading">Why do you want to join?</div>
    <textarea aria-label="Why do you want to join?"></textarea>
  </div>
  <div role="button" id="submitBtn" tabindex="0" onclick="doSubmit()">Submit</div>
</div>
<script>
function goPage2(){
  document.getElementById('page1').classList.add('hidden');
  document.getElementById('page2').classList.remove('hidden');
}
function toggleOpts(){
  document.querySelectorAll('#edu .opt').forEach(o => o.classList.toggle('hidden'));
}
function doSubmit(){
  document.getElementById('page2').innerHTML = '<h1>Your response has been recorded.</h1>';
}
</script>
</body></html>
